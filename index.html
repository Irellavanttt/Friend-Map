<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ablora Map</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The map keeps a 16:9 shape so marker positions (in %) always line up -->
  <main id="map" aria-label="Map of Ablora">
    <!-- Markers are created by script.js from the list at the top of that file -->

    <!-- One shared popup, moved next to whichever marker is clicked -->
    <div id="popup" role="dialog" aria-live="polite" hidden>
      <button id="popup-close" type="button" aria-label="Close">&times;</button>
      <img id="popup-image" alt="">
      <h2 id="popup-title"></h2>
      <p id="popup-text"></p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
